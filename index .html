<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>منظومة إدارة وتأهيل الموردين</title>
<meta name="description" content="إدارة وتأهيل الموردين وترشيحهم للمناقصات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* نسق الواجهات: بنفسجي متدرّج مع لمسة صفراء، وبطاقات بيضاء مستديرة على خلفية فاتحة */
  --bg: #f4f2f8;
  --surface: #ffffff;
  --surface-2: #f9f7fc;
  --border: #e9e3f0;
  --text: #221a2e;
  --muted: #6f6780;
  --primary: #742a8c;
  --primary-600: #5c1f71;
  --primary-50: #f5edf9;
  --accent: #f6c445;
  --grad: linear-gradient(100deg, #8d3d9f 0%, #6b2683 48%, #47195a 100%);
  --ok: #1f8a4c;
  --ok-50: #e9f7ef;
  --warn: #b5650a;
  --warn-50: #fff4e3;
  --danger: #c4302b;
  --danger-50: #fdeeee;
  --info-50: #f3ecf9;
  --tierA: #742a8c;
  --tierB: #1e9e8a;
  --tierC: #c07a12;
  --radius: 16px;
  --shadow: 0 2px 10px rgba(74, 26, 94, .06);
  --shadow-lg: 0 16px 40px rgba(74, 26, 94, .2);
  --font: "Cairo", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14.5px; line-height: 1.6; }
a { color: var(--primary); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }

/* ---------- Layout: شريط علوي بنفسجي ---------- */
.layout { min-height: 100vh; display: flex; flex-direction: column; }
.topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--grad); color: #fff; box-shadow: 0 4px 18px rgba(74, 26, 94, .25); }
.topnav-in { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 14px; min-height: 66px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; gap: 10px; align-items: center; flex-shrink: 0; padding-inline-end: 16px; border-inline-end: 1px solid rgba(255,255,255,.22); color: #fff; }
.brand-mark { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--accent); display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.08); }
.brand-title { color: #fff; font-weight: 800; font-size: 17px; line-height: 1.2; }
.brand-sub { font-size: 11.5px; color: rgba(255,255,255,.75); }
.nav { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { color: rgba(255,255,255,.92); padding: 8px 12px; border-radius: 10px; display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; white-space: nowrap; position: relative; transition: background .15s; }
.nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav a.active { background: rgba(255,255,255,.18); color: #fff; }
.nav a.active::after { content: ""; position: absolute; bottom: 3px; left: 30%; right: 30%; height: 2px; border-radius: 2px; background: #fff; }
.nav a.nav-hl:not(.active) .ico { color: var(--accent); }
.nav .ico, .nav-sys .ico { display: inline-grid; place-items: center; }
.nav-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.nav-sys { display: inline-flex; align-items: center; gap: 7px; color: #fff; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.nav-sys:hover, .nav-sys.active { background: rgba(255,255,255,.2); }
.tool-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; cursor: pointer; position: relative; font-family: inherit; }
.tool-btn:hover { background: rgba(255,255,255,.2); }
.tool-btn .dot { position: absolute; top: -7px; left: -7px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: #e5484d; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid #6b2683; }
.user-menu-wrap { position: relative; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 8px 4px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font-family: inherit; }
.user-chip:hover { background: rgba(255,255,255,.16); }
.user-chip .u-av { width: 32px; height: 32px; border-radius: 50%; background: #f5edf9; color: var(--primary); display: grid; place-items: center; flex-shrink: 0; }
.user-chip b { display: block; font-size: 13px; line-height: 1.25; text-align: start; }
.user-chip small { display: block; font-size: 11px; color: rgba(255,255,255,.78); text-align: start; }
.user-menu { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; width: 290px; background: #fff; color: var(--text); border-radius: 14px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); padding: 14px; z-index: 60; }
.user-menu .um-head { display: flex; gap: 10px; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.user-menu .um-head .u-av { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-50); color: var(--primary); display: grid; place-items: center; }
.user-menu .um-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.user-menu .um-row label { font-size: 12px; font-weight: 600; color: var(--muted); }
.user-menu .select-sm, .user-menu .input-sm { width: 100%; }
.menu-btn { display: none !important; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.crumbs-bar { max-width: 1440px; width: 100%; margin: 0 auto; padding-top: 16px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.crumbs { color: var(--muted); font-size: 13px; }
.crumbs b { color: var(--primary); }
.view { padding: 14px 24px 48px; max-width: 1440px; width: 100%; margin: 0 auto; }

/* ---------- Common ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
.card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-body { padding: 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }

.btn { font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 16px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: all .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: #cfd7e2; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-600); border-color: var(--primary-600); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-ok:hover { background: #156640; }
.btn-danger { color: var(--danger); border-color: #f1c4bf; }
.btn-danger:hover { background: var(--danger-50); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn-lg { padding: 12px 22px; font-size: 15px; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.no-dot::before { display: none; }
.b-ok { background: var(--ok-50); color: var(--ok); border-color: #bfe3cf; }
.b-warn { background: var(--warn-50); color: var(--warn); border-color: #f5d9a8; }
.b-danger { background: var(--danger-50); color: var(--danger); border-color: #f3c3bd; }
.b-info { background: var(--primary-50); color: var(--primary); border-color: #c6dcea; }
.tier { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 13px; }
.tier-A { background: var(--tierA); } .tier-B { background: var(--tierB); } .tier-C { background: var(--tierC); }
.tier-lg { width: 44px; height: 44px; font-size: 20px; border-radius: 11px; }

/* ---------- Forms ---------- */
label.lbl { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
label.lbl .req { color: var(--danger); margin-inline-start: 2px; }
.input, .select, textarea.input { width: 100%; font-family: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid #cfd7e2; border-radius: 9px; background: #fff; color: var(--text); transition: border .15s, box-shadow .15s; }
.input:focus, .select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(11,92,138,.14); }
.input.invalid, .select.invalid { border-color: var(--danger); background: #fffafa; }
.input[dir=ltr] { text-align: left; }
.field-err { color: var(--danger); font-size: 12px; margin-top: 4px; min-height: 0; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.input-sm, .select-sm { font-family: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.input-sm { width: 140px; }
.input-group { position: relative; }
.input-group .suffix { position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; user-select: none; font-family: inherit; transition: all .15s; }
.chip:hover { border-color: var(--primary); }
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.disabled { opacity: .45; pointer-events: none; }
.radio-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.radio-card { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.radio-card.on { border-color: var(--primary); background: var(--primary-50); }
.radio-card input { accent-color: var(--primary); }
.switch { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; }
.switch input { accent-color: var(--primary); width: 16px; height: 16px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: start; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover { background: #fafcfe; }
.tbl tr.clickable { cursor: pointer; }
.tbl .name { font-weight: 600; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }

/* ---------- KPI ---------- */
.kpi { padding: 18px 20px; }
.kpi .k-label { color: var(--muted); font-size: 13px; font-weight: 500; }
.kpi .k-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.kpi .k-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.kpi.accent { border-top: 3px solid var(--primary); }
.kpi.ok { border-top: 3px solid var(--ok); }
.kpi.warn { border-top: 3px solid var(--warn); }
.kpi.danger { border-top: 3px solid var(--danger); }

.hbar { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
.hbar .hb-label { width: 180px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .hb-track { flex: 1; height: 10px; background: #edf1f6; border-radius: 6px; overflow: hidden; display: flex; }
.hbar .hb-fill { height: 100%; background: var(--primary); }
.hbar .hb-fill.q { background: var(--ok); }
.hbar .hb-val { width: 44px; text-align: end; font-weight: 600; }
.stackbar { display: flex; height: 14px; border-radius: 8px; overflow: hidden; background: #edf1f6; }
.stackbar > div { height: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: middle; }

/* ---------- Matching screen ---------- */
.match-hero { background: linear-gradient(135deg, #0d2438 0%, #0b5c8a 100%); color: #fff; border-radius: 16px; padding: 26px; box-shadow: var(--shadow-lg); }
.match-hero h1 { color: #fff; }
.match-hero p { color: #c9d9e7; margin: 6px 0 0; }
.match-form { display: grid; grid-template-columns: 1.6fr 1.3fr 1fr; gap: 16px; margin-top: 20px; align-items: start; }
.match-hero label.lbl { color: #d9e6f1; }
.value-input { font-size: 30px !important; font-weight: 700; padding: 12px 16px !important; letter-spacing: .5px; direction: ltr; text-align: left; height: 62px; }
.match-hero .input, .match-hero .select { border-color: transparent; }
.match-hero .select { height: 46px; }
.match-hero .hint { color: #b7cbdc; }
.words { min-height: 20px; font-size: 13px; color: #f3d79a; margin-top: 6px; font-weight: 500; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.quick button { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 3px 12px; font-family: inherit; font-size: 12.5px; cursor: pointer; }
.quick button:hover { background: rgba(255,255,255,.2); }
.match-hero .switch { color: #d9e6f1; margin-top: 10px; }

.summary { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; margin: 18px 0; }
.summary .card { padding: 14px 16px; }
.summary .s-label { color: var(--muted); font-size: 12.5px; }
.summary .s-value { font-size: 22px; font-weight: 700; margin-top: 2px; }
.rule-box { background: var(--info-50); border: 1px solid #d5dcfb; border-radius: 10px; padding: 12px 16px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 12px; }
.tab { padding: 12px 16px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; font-size: 14px; }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); }
.tab .cnt { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-size: 12px; margin-inline-start: 6px; }
.tab.on .cnt { background: var(--primary); color: #fff; border-color: var(--primary); }

.cand { display: grid; grid-template-columns: 28px 44px minmax(200px, 1.6fr) minmax(220px, 2fr) 120px 110px; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.cand:last-child { border-bottom: none; }
.cand.excluded { background: #fffcfb; }
.cand .c-name { font-weight: 600; }
.cand input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); }
.gauge { position: relative; height: 12px; background: #edf1f6; border-radius: 6px; overflow: visible; }
.gauge .g-fill { position: absolute; inset-inline-start: 0; top: 0; height: 100%; border-radius: 6px; background: var(--ok); }
.gauge .g-fill.warn { background: #e2a336; }
.gauge .g-fill.over { background: var(--danger); }
.gauge .g-limit { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .65; }
.gauge-cap { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.score { display: flex; align-items: center; gap: 8px; }
.score .s-ring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.reason { background: var(--danger-50); color: var(--danger); border: 1px solid #f3c3bd; border-radius: 6px; padding: 1px 8px; font-size: 12px; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 8px; padding: 12px 18px 16px 18px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.check { display: flex; gap: 8px; font-size: 12.5px; align-items: flex-start; }
.check .ci { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; flex-shrink: 0; margin-top: 1px; }
.check .ci.ok { background: var(--ok); } .check .ci.no { background: var(--danger); }

.capmap { padding: 18px 20px; }
.capmap .cm-row { display: grid; grid-template-columns: 220px 1fr 120px; gap: 12px; align-items: center; margin: 6px 0; font-size: 13px; }
.capmap .cm-track { position: relative; height: 18px; background: #f1f4f8; border-radius: 4px; }
.capmap .cm-bar { position: absolute; inset-inline-start: 0; top: 0; bottom: 0; border-radius: 4px; background: #9cc3dc; }
.capmap .cm-bar.ok { background: var(--ok); opacity: .8; }
.capmap .cm-line { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--danger); z-index: 2; }
.capmap .cm-line::after { content: attr(data-label); position: absolute; top: -18px; transform: translateX(50%); font-size: 11px; color: var(--danger); white-space: nowrap; font-weight: 600; }

.sticky-actions { position: sticky; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(4px); border-top: 1px solid var(--border); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-radius: 0 0 var(--radius) var(--radius); flex-wrap: wrap; }

.compare-table { width: 100%; border-collapse: collapse; }
.compare-table th, .compare-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: start; font-size: 13.5px; }
.compare-table th { width: 170px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.compare-table td.best { background: var(--ok-50); font-weight: 600; }

/* ---------- Wizard ---------- */
.wizard { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
.steps { padding: 10px; position: sticky; top: 80px; }
.step { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--muted); }
.step:hover { background: var(--surface-2); }
.step .s-num { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; background: #fff; }
.step .s-title { font-weight: 600; font-size: 13.5px; }
.step .s-desc { font-size: 11.5px; }
.step.on { background: var(--primary-50); color: var(--primary); }
.step.on .s-num { border-color: var(--primary); background: var(--primary); color: #fff; }
.step.done .s-num { border-color: var(--ok); background: var(--ok); color: #fff; }
.step.err .s-num { border-color: var(--danger); background: var(--danger); color: #fff; }
.progress { height: 6px; background: #edf1f6; border-radius: 4px; margin: 6px 12px 14px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); transition: width .3s; }
.step-panel h2 { display: flex; gap: 10px; align-items: center; }
.step-panel .sp-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--primary-50); color: var(--primary); display: grid; place-items: center; font-size: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.form-grid .full { grid-column: 1 / -1; }
.wiz-foot { display: flex; justify-content: space-between; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.validity { margin-top: 6px; }
.callout { border-radius: 10px; padding: 12px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; }
.callout.info { background: var(--primary-50); color: #0a4a6f; }
.callout.warn { background: var(--warn-50); color: #7a4a00; }
.callout.ok { background: var(--ok-50); color: #125c38; }
.callout.danger { background: var(--danger-50); color: #8a1b12; }
.partners-table td { padding: 6px; }
.partners-table input { margin: 0; }
.review-sec { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
.review-sec .rs-head { padding: 10px 14px; background: var(--surface-2); display: flex; justify-content: space-between; align-items: center; font-weight: 600; border-radius: 10px 10px 0 0; }
.review-sec dl { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px 16px; padding: 12px 14px; margin: 0; }
.review-sec dt { font-size: 12px; color: var(--muted); }
.review-sec dd { margin: 0; font-weight: 500; }
.doc-slots { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.doc-slot { border: 1.5px dashed #c7d1dd; border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: all .15s; }
.doc-slot:hover { border-color: var(--primary); background: var(--primary-50); }
.doc-slot.has { border-style: solid; border-color: #bfe3cf; background: var(--ok-50); }
.doc-slot .ds-ico { font-size: 22px; width: 40px; height: 40px; display: grid; place-items: center; background: #fff; border-radius: 8px; border: 1px solid var(--border); }
.doc-slot input { display: none; }

/* ---------- Profile ---------- */
.profile-head { display: flex; gap: 18px; align-items: flex-start; }
.avatar { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(135deg, #0b5c8a, #2f8f83); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 700; flex-shrink: 0; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 18px; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-weight: 500; word-break: break-word; }
.legal-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: #fff; }
.legal-card .lc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.legal-card .lc-title { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.legal-card .lc-ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--primary-50); color: var(--primary); }
.approval { border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.approval .ap-state { font-weight: 700; }
.timeline { position: relative; padding-inline-start: 22px; }
.timeline::before { content: ""; position: absolute; inset-inline-start: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item::before { content: ""; position: absolute; inset-inline-start: -21px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2.5px solid var(--primary); }
.tl-item .tl-meta { font-size: 12px; color: var(--muted); }
.doc-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.doc-row:last-child { border-bottom: none; }

/* ---------- Modal & toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(13,36,56,.45); display: grid; place-items: center; z-index: 100; padding: 20px; animation: fade .15s; }
.modal { background: #fff; border-radius: 14px; width: min(620px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg); }
.modal.wide { width: min(1000px, 100%); }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; background: var(--surface-2); }
.toasts { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
.toast { background: #0d2438; color: #fff; padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 14px; min-width: 260px; max-width: 420px; animation: slide .2s; border-inline-start: 4px solid var(--ok); }
.toast.err { border-inline-start-color: #ff6b5e; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateY(12px); opacity: 0; } }
.skeleton { background: linear-gradient(90deg, #eef2f6 25%, #f6f8fb 50%, #eef2f6 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 8px; height: 16px; }
@keyframes sk { to { background-position: -200% 0; } }

/* ---------- Print ---------- */
.print-only { display: none; }
@media print {
  .topnav, .crumbs-bar, .fab, .no-print, .toasts { display: none !important; }
  .print-only { display: block; }
  body { background: #fff; }
  .view { padding: 0; max-width: none; }
  .card { box-shadow: none; border-color: #bbb; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .summary { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .match-form { grid-template-columns: 1fr 1fr; }
  .match-form > :first-child { grid-column: 1 / -1; }
  .cand { grid-template-columns: 28px 44px 1fr 110px; }
  .cand .c-gauge, .cand .c-exp { grid-column: 3 / -1; }
  .wizard { grid-template-columns: 1fr; }
  .steps { position: static; display: flex; overflow-x: auto; gap: 4px; }
  .steps .step .s-desc { display: none; }
  .steps .progress { display: none; }
}
@media (max-width: 760px) {
  .view { padding: 12px 16px 40px; }
  .g2, .g3, .g4, .form-grid, .kv, .doc-slots, .review-sec dl, .radio-cards { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .summary { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .match-form { grid-template-columns: 1fr; }
  .capmap .cm-row { grid-template-columns: 1fr; gap: 4px; }
  .summary .s-value { font-size: 17px; }
  .cand { grid-template-columns: 24px 1fr auto; gap: 10px; padding: 14px; }
  .cand > :nth-child(2) { display: none; }
  .cand .c-gauge { grid-column: 1 / -1; order: 5; }
  .cand > :last-child { grid-column: 1 / -1; order: 6; justify-content: flex-start !important; }
  .sticky-actions { position: static; }
  .sticky-actions .row { width: 100%; }
  .sticky-actions .btn-primary { flex: 1; justify-content: center; }
  .profile-head { flex-wrap: wrap; }
  .value-input { font-size: 24px !important; }
  .hbar .hb-label { width: 110px; }
}

/* ---------- صفحة الإضافة الموحدة ---------- */
.form-progress { padding: 14px 18px; position: sticky; top: 60px; z-index: 10; }
.form-section { scroll-margin-top: 170px; }
.sec-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.sec-body.no-docs { grid-template-columns: minmax(0, 1fr); }
.sec-docs { display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.sec-docs .doc-slot { padding: 10px; }
.save-bar { position: sticky; bottom: 0; z-index: 10; margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 -6px 18px rgba(16,24,40,.08); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ---------- سير عمل المراجعة والاعتماد ---------- */
.wf-steps { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; flex-wrap: wrap; }
.wf-step { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.wf-step b { color: var(--text); font-size: 13.5px; }
.wf-num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid var(--border); background: #fff; flex-shrink: 0; }
.wf-step.done .wf-num { background: var(--ok); border-color: var(--ok); color: #fff; }
.wf-step.on .wf-num { background: var(--primary); border-color: var(--primary); color: #fff; }
.wf-step.ret .wf-num { background: var(--danger); border-color: var(--danger); color: #fff; }
.wf-line { flex: 1; min-width: 24px; height: 2px; background: var(--border); }
.wf-box.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(11,92,138,.10); }
.wf-box.done { background: var(--ok-50); border-color: #bfe3cf; }
.wf-checks { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-size: 13px; }
@media (max-width: 1100px) { .sec-body { grid-template-columns: 1fr; } .form-progress { top: 60px; } }
@media (max-width: 760px) { .wf-line { display: none; } .form-progress { position: static; } }

/* ---------- الطباعة / PDF ---------- */
.print-head { text-align: center; margin-bottom: 18px; border-bottom: 2px solid var(--text); padding-bottom: 10px; }
.print-head h1 { font-size: 20px; }
.sign-row { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  .sign-row { display: flex; justify-content: space-between; margin-top: 40px; font-size: 13px; }
  .tbl th, .tbl td { padding: 6px 8px; font-size: 11.5px; }
  .tbl tr.clickable { cursor: default; }
  .card { break-inside: avoid; }
  a { color: inherit; }
}

/* ---- تكييف المنصة ---- */
:root { color-scheme: light; }
body { background: var(--bg); color: var(--text); }
.view { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.toasts { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: calc(20px + env(safe-area-inset-left, 0px)); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (max-width: 760px) { .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- النسق الجديد: مكونات ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 45; background: #6b2683; }
.input:focus, .select:focus { box-shadow: 0 0 0 3px rgba(116,42,140,.15); }
.wf-box.active { box-shadow: 0 0 0 3px rgba(116,42,140,.12); }
.card { border-radius: var(--radius); }
.card-head { position: relative; }
.card-head::before { content: ""; position: absolute; inset-inline-start: 0; top: 13px; bottom: 13px; width: 4px; border-radius: 4px; background: var(--primary); }
.card-head h2 { font-weight: 700; }
.btn { border-radius: 10px; }
.btn-primary { box-shadow: 0 4px 12px rgba(116,42,140,.22); }
.btn-ok { background: var(--ok); border-color: var(--ok); }
.icon-btn { border-radius: 10px; }
.tbl th { background: #f4edf9; color: #4b2a5e; font-weight: 700; }
.tbl tbody tr:hover { background: #fbf8fd; }
.page-head { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px 18px 22px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.page-head::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, var(--accent), var(--primary)); }
.page-head h1 { font-weight: 800; }
.tabs { padding: 10px 12px; gap: 6px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { border: none; border-radius: 10px; padding: 8px 14px; margin: 0; }
.tab:hover { background: var(--primary-50); }
.tab.on { background: var(--primary); color: #fff; }
.tab.on .cnt { background: #fff; color: var(--primary); border-color: #fff; }
.chip.on { background: var(--primary); border-color: var(--primary); }
.kpi { border-radius: var(--radius); }
.summary .card { border-radius: 14px; }
.rule-box { background: var(--primary-50); border-color: #e6d3f0; border-radius: 12px; }
.capmap .cm-bar { background: #cdb6dc; }
.avatar { background: var(--grad); border-radius: 16px; }
.modal-back { background: rgba(40,14,60,.45); }
.modal { border-radius: 18px; }
.toast { background: #3b1650; }
.toasts { left: calc(96px + env(safe-area-inset-left, 0px)) !important; }
.match-hero, .hero { background: var(--grad); border-radius: 20px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(74,26,94,.22); }
.match-hero::after, .hero::after, .login-panel::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 2px, transparent 2px 22px); pointer-events: none; }
.match-hero > *, .hero > * { position: relative; z-index: 1; }
.match-hero p { color: rgba(255,255,255,.86); }
.match-hero label.lbl, .match-hero .switch { color: #fff; }
.match-hero .hint { color: rgba(255,255,255,.75); }
.words { color: var(--accent); }
.quick button { border-color: rgba(255,255,255,.3); }

/* الترحيب */
.hero { color: #fff; padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
.hero .h-date { font-size: 13px; color: rgba(255,255,255,.85); display: flex; gap: 6px; align-items: center; }
.hero h1 { color: #fff; font-size: 26px; font-weight: 800; margin: 6px 0 4px; }
.hero h1 .hl { color: var(--accent); }
.hero p { margin: 0; color: rgba(255,255,255,.85); }
.hero-links { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-card { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: 10px 14px; color: #fff; transition: background .15s; }
.hero-card:hover { background: rgba(255,255,255,.2); }
.hero-card .hc-ico { width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: #47195a; display: grid; place-items: center; flex-shrink: 0; }
.hero-card b { display: block; font-size: 14.5px; }
.hero-card small { display: block; font-size: 12px; color: rgba(255,255,255,.8); }

/* بطاقات المؤشرات الملوّنة */
.stats-card { padding: 16px 18px 14px; margin-bottom: 16px; }
.stats-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 14px; }
.stats-head .sh-ico { color: var(--primary); display: inline-grid; place-items: center; }
.link-more { font-size: 13px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid; color: var(--text); transition: transform .15s, box-shadow .15s; }
a.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.stat .st-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.stat .st-val { font-size: 24px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .st-lbl { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.t-purple { background: #f7f0fb; border-color: #eadcf2; } .t-purple .st-ico { background: var(--primary); }
.t-green { background: #edf8f2; border-color: #d2ecdd; } .t-green .st-ico { background: #22a05a; }
.t-blue { background: #eef4fd; border-color: #d6e4f8; } .t-blue .st-ico { background: #3b7be8; }
.t-orange { background: #fdf3ea; border-color: #f4dcc3; } .t-orange .st-ico { background: #b8620f; }
.t-red { background: #fdf0f1; border-color: #f5d4d7; } .t-red .st-ico { background: #e0464c; }
.t-yellow { background: #fef8e8; border-color: #f5e3b3; } .t-yellow .st-ico { background: #eea21a; }
.ready { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.ready-track { flex: 1; height: 8px; border-radius: 999px; background: #eee9f3; overflow: hidden; }
.ready-track > div { height: 100%; border-radius: 999px; background: #34b35a; }

/* زر الإضافة العائم */
.fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: calc(24px + env(safe-area-inset-left, 0px)); width: 56px; height: 56px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(74,26,94,.38); z-index: 30; border: 3px solid #fff; }
.fab:hover { filter: brightness(1.1); }

/* شاشة الدخول */
.login-screen { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(circle at 85% 10%, #efe2f6 0, transparent 45%), radial-gradient(circle at 10% 90%, #f6eedb 0, transparent 40%), var(--bg); }
.login-card { width: min(940px, 100%); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); background: #fff; border-radius: 26px; overflow: hidden; box-shadow: 0 24px 60px rgba(74,26,94,.18); }
.login-panel { background: var(--grad); color: #fff; padding: 38px 34px 24px; position: relative; display: flex; flex-direction: column; gap: 16px; }
.login-panel > * { position: relative; z-index: 1; }
.lp-mark { width: 88px; height: 88px; border-radius: 50%; border: 6px solid var(--accent); display: grid; place-items: center; margin: 0 auto; background: rgba(255,255,255,.08); }
.login-panel h2 { text-align: center; font-size: 27px; font-weight: 800; margin: 4px 0 0; }
.login-panel h2 .hl { color: var(--accent); }
.lp-ver { align-self: center; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 2px 14px; font-size: 12.5px; background: rgba(255,255,255,.1); }
.lp-desc { text-align: center; color: rgba(255,255,255,.88); font-size: 14px; margin: 0; }
.lp-feat { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.lp-feat li { display: flex; gap: 12px; align-items: center; }
.lp-feat .fi { width: 42px; height: 42px; border-radius: 11px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); display: grid; place-items: center; flex-shrink: 0; }
.lp-feat b { display: block; font-size: 14.5px; }
.lp-feat span { font-size: 12.5px; color: rgba(255,255,255,.8); }
.lp-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.2); padding-top: 12px; font-size: 12px; color: rgba(255,255,255,.78); text-align: center; }
.login-form { padding: 38px 34px 28px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.lf-ico { width: 58px; height: 58px; border-radius: 16px; background: var(--primary-50); border: 1px solid #e6d3f0; color: var(--primary); display: grid; place-items: center; margin: 0 auto; }
.login-form h1 { text-align: center; font-size: 25px; font-weight: 800; }
.lf-sub { text-align: center; color: var(--muted); font-size: 13px; margin: -8px 0 4px; }
.lf-field { position: relative; }
.lf-field .input { padding-inline-start: 44px; height: 50px; border-radius: 12px; background: #fbfafd; font-size: 15px; }
.lf-field .lf-i { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: #8a8296; pointer-events: none; display: grid; }
.lf-field .input.pw { padding-inline-end: 46px; }
.lf-eye { position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; color: #8a8296; padding: 6px; border-radius: 8px; display: grid; }
.lf-eye:hover { background: var(--primary-50); color: var(--primary); }
.lf-btn { height: 50px; border-radius: 12px; justify-content: center; font-size: 16px; width: 100%; }
.lf-note { border-top: 1px dashed var(--border); padding-top: 12px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.lf-note .ni { color: #3b7be8; display: grid; flex-shrink: 0; margin-top: 2px; }
.demo-accts { background: var(--surface-2); border: 1px dashed #dcc8e8; border-radius: 12px; padding: 10px; display: grid; gap: 6px; }
.demo-accts .da-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 4px 2px; }
.demo-accts .da-head b { color: var(--text); }
.acct { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 6px 10px; cursor: pointer; font-family: inherit; text-align: start; color: var(--text); }
.acct:hover { border-color: var(--primary); }
.acct .a-av { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.acct b { font-size: 13px; display: block; line-height: 1.3; }

// ---------- تواريخ (صيغة yyyy-mm-dd بتوقيت UTC) ----------

const dnum = s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const shift = (iso, { y = 0, m = 0, d = 0 }) => { const t = new Date(iso + "T00:00:00Z"); t.setUTCFullYear(t.getUTCFullYear() + y); t.setUTCMonth(t.getUTCMonth() + m); t.setUTCDate(t.getUTCDate() + d); return t.toISOString().slice(0, 10); };
const ymd = (y, m, d) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

// ---------- بيانات تجريبية: 30 مورداً (أسماء افتراضية) ----------

function buildSeed() {
  const t = todayIso();
  return SEED_ROWS.map((r, i) => {
    const [ar, en, form, cityIx, act, subs, capital, scenario] = r, n = i + 1, city = CITIES[cityIx], incYear = 2005 + (i * 7 % 17);
    const slug = en.split(" ")[0].toLowerCase().replace(/-/g, "") + n;

let DB = null, FILES = {};

}
function persistFiles() {
  try { localStorage.setItem(FILES_KEY, JSON.stringify(FILES)); return true; } catch { return false; }
}
async function initDb(force) {
  if (!force) {
    try { DB = JSON.parse(localStorage.getItem(DB_KEY) || "null"); FILES = JSON.parse(localStorage.getItem(FILES_KEY) || "{}"); } catch { DB = null; }
  }
  if (!DB || force) {
    const suppliers = buildSeed(), documents = [];
    const names = { CommercialRegistry: "commercial-registry", PracticeLicense: "practice-license", RealEstateRegistry: "real-estate-deed", IncorporationContract: "incorporation-contract", BankLetter: "bank-letter" };

      documents.push({ id: documents.length + 1, supplierId: sp.id, type, fileName: nm + ".pdf", contentType: "application/pdf", size: 620, uploadedAt: sp.createdAt, uploadedBy: "مسؤول المشتريات", stored: false, sample: true });
    }));

async function sha256(text) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch {
    let h1 = 0x811c9dc5, out = ""; // بديل احتياطي إن لم تتوفر Web Crypto
    for (let k = 0; k < 8; k++) { for (const ch of text + k) { h1 ^= ch.charCodeAt(0); h1 = Math.imul(h1, 16777619) >>> 0; } out += h1.toString(16).padStart(8, "0"); }
    return out;
  }
}

async function audit(u, action, entity, entityId, details) {

  const l = { id: ++DB.seq.audit, timestamp: new Date().toISOString(), user: u.name, role: u.role, action, entity, entityId, details, prevHash };
  l.hash = await sha256(rawOf(l));
  DB.audit.push(l);
}

function evaluate(q) {

  const out = [];
  for (const x of DB.suppliers) {
    const match = !q.activity || x.mainActivity === q.activity || (includeSubs && splitSubs(x.subActivities).includes(q.activity));
    if (!match) continue;
    const checks = [], miss = missingCore(x);
    checks.push({ code: "BR-01", title: "اكتمال البيانات والوثائق", passed: !miss.length, message: !miss.length ? "البيانات الأساسية مكتملة" : "ناقص: " + miss.join("، ") });
    const approved = x.financialApproval === "Approved" && x.legalApproval === "Approved" && x.activationApproval === "Approved" && x.status === "Qualified";
    checks.push({ code: "BR-02", title: "الاعتماد والتفعيل", passed: approved, message: approved ? "معتمد مالياً وقانونياً ومُفعّل من إدارة الفرع" : `الحالة: ${STATUS_AR[x.status]} · مالي: ${APPROVAL_AR[x.financialApproval]} · قانوني: ${APPROVAL_AR[x.legalApproval]} · التفعيل: ${APPROVAL_AR[x.activationApproval]}` });
    const crOk = !!x.commercialRegExpiryDate && x.commercialRegExpiryDate >= refDate;
    checks.push({ code: "LEG-1", title: "سريان السجل التجاري", passed: crOk, message: crOk ? `ساري حتى ${x.commercialRegExpiryDate}` : !x.commercialRegExpiryDate ? "تاريخ الانتهاء غير مدخل" : `منتهي منذ ${x.commercialRegExpiryDate}` });
    const licOk = !!x.practiceLicenseExpiryDate && x.practiceLicenseExpiryDate >= refDate;
    checks.push({ code: "LEG-2", title: "سريان إذن مزاولة النشاط", passed: licOk, message: licOk ? `ساري حتى ${x.practiceLicenseExpiryDate}` : !x.practiceLicenseExpiryDate ? "غير مدخل" : `منتهي منذ ${x.practiceLicenseExpiryDate}` });
    const maxValue = Math.round(x.capital * ratio * 100) / 100;
    const capOk = value <= maxValue;
    const util = x.capital > 0 ? Math.round(value / x.capital * 1000) / 10 : 999;
    checks.push({ code: "BR-04", title: "الملاءة المالية مقابل قيمة المناقصة", passed: capOk, message: capOk ? `القيمة تمثل ${util}% من رأس المال (الحد ${Math.round(ratio * 100)}%)` : `القيمة تمثل ${util}% من رأس المال وتتجاوز الحد ${Math.round(ratio * 100)}% — العجز ${N0(value - maxValue)} د.ل` });

  ["POST", /^\/api\/tenders$/, async (u, m, i) => {

    const r = evaluate({ value: i.value, activity: i.activity, referenceDate: i.closingDate });
    const elig = new Map(r.candidates.filter(c => c.eligible).map(c => [c.supplierId, c]));
    const chosen = i.supplierIds?.length ? [...new Set(i.supplierIds)] : [...elig.keys()];
    const bad = chosen.filter(id => !elig.has(id));
    if (bad.length) fail(400, `${bad.length} من الموردين المختارين غير مؤهلين لهذه المناقصة`);
    if (!chosen.length) fail(400, "لا يوجد موردون مؤهلون لهذه المناقصة");
    const id = ++DB.seq.tender;
    const t = { id, refNo: `TND-${new Date().getFullYear()}-${String(id).padStart(3, "0")}`, title: i.title.trim(), activity: i.activity, value: Number(i.value), closingDate: i.closingDate, description: i.description || null, createdAt: nowIso(), createdBy: u.name, invitations: chosen.map(sid => ({ supplierId: sid, capitalUtilization: elig.get(sid).utilization })) };

  ["GET", /^\/api\/dashboard$/, () => {

    const groups = {};
    all.forEach(x => { const g = groups[x.mainActivity] ||= { activity: x.mainActivity, count: 0, qualified: 0 }; g.count++; if (x.status === "Qualified") g.qualified++; });
    return {
      total: all.length, qualified: all.filter(x => x.status === "Qualified").length, pending: all.filter(x => x.status === "PendingVerification").length,
      returned: all.filter(x => x.status === "Returned").length, suspended: all.filter(x => x.status === "Suspended" || x.status === "Rejected").length,
      completeness: all.length ? Math.round(all.filter(x => !missingCore(x).length).length * 1000 / all.length) / 10 : 0,
      totalCapital: all.reduce((a, x) => a + x.capital, 0),
      tiers: ["A", "B", "C"].map(t => ({ tier: t, count: all.filter(x => classify(x.capital) === t).length })),
      byActivity: Object.values(groups).sort((a, b) => b.count - a.count),
      expired: alerts.filter(a => a.days < 0).length, expiringSoon: alerts.filter(a => a.days >= 0).length, alerts: alerts.slice(0, 15),
      tenders: DB.tenders.length, tendersValue: DB.tenders.reduce((a, t) => a + t.value, 0),
      pendingReview: all.filter(x => x.status === "PendingVerification" || x.status === "Returned").slice(0, 10).map(x => ({ id: x.id, code: x.code, nameAr: x.nameAr, financialApproval: x.financialApproval, legalApproval: x.legalApproval, activationApproval: x.activationApproval, status: x.status })),
      recent: DB.audit.slice(-8).reverse(),
    };
  }],

  ["GET", /^\/api\/audit$/, (u, m, b, q) => {
    let l = DB.audit;
    if (q.entity) l = l.filter(a => a.entity === q.entity);
    if (q.entityId) l = l.filter(a => a.entityId === +q.entityId);
    if (q.q) l = l.filter(a => a.details.includes(q.q) || a.user.includes(q.q));
    return l.slice().reverse().slice(0, Math.min(Math.max(+q.take || 200, 1), 1000));
  }],

  ["GET", /^\/api\/audit\/verify$/, async () => {
    let prev = "0".repeat(64), count = 0;
    for (const l of DB.audit) {
      count++;
      if (l.prevHash !== prev || await sha256(rawOf(l)) !== l.hash) return { ok: false, brokenAt: l.id, count };
      prev = l.hash;
    }
    return { ok: true, brokenAt: null, count };
  }],

  ["GET", /^\/api\/settings$/, () => settings()],
  ["PUT", /^\/api\/settings$/, async (u, m, i) => {

    const s = settings(), pc = v => Math.round(v * 100) + "%";

    Object.assign(s, { tierAMin: i.tierAMin, tierBMin: i.tierBMin, maxTenderToCapitalRatio: i.maxTenderToCapitalRatio, expiryWarningDays: i.expiryWarningDays });
    await audit(u, "UpdateSettings", "Settings", 1, details);
    return s;
  }],
];

/** نفس توقيع دالة api في نسخة الخادم: api(method, url, body, isForm) */
async function api(method, url, body) {
  if (!DB) await initDb();
  const [path, qs] = url.split("?");
  const q = Object.fromEntries(new URLSearchParams(qs || ""));
  const u = { name: user.name, role: user.role };
  for (const [mth, re, fn] of ROUTES) {
    const m = path.match(re);
    if (mth === method && m) {
      const res = await fn(u, m, body, q);
      if (method !== "GET") persist();
      return res == null ? null : clone(res);
    }
  }
  fail(404, "المسار غير موجود");
}

const nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });

const statusBadge = s => `<span class="badge ${STATUS[s]?.[1] || ""}">${STATUS[s]?.[0] || s}</span>`;

function validityBadge(date, warnDays) {
  if (!date) return `<span class="badge">غير مدخل</span>`;
  const d = daysTo(date);
  if (d < 0) return `<span class="badge b-danger">منتهي منذ ${-d} يوم</span>`;
  if (d <= (warnDays ?? state.meta?.settings?.expiryWarningDays ?? 60)) return `<span class="badge b-warn">ينتهي خلال ${d} يوم</span>`;
  return `<span class="badge b-ok">ساري · ${d} يوم متبقٍ</span>`;
}

/** تحويل الرقم إلى وصف مقروء: 2,500,000 → "2.5 مليون دينار ليبي" */
function amountWords(v) {
  v = Number(v); if (!v) return "";
  const f = (n, d) => Number(n.toFixed(d)).toLocaleString("en-US");
  if (v >= 1e9) return `${f(v / 1e9, 2)} مليار دينار ليبي`;
  if (v >= 1e6) return `${f(v / 1e6, 2)} مليون دينار ليبي`;
  if (v >= 1e3) return `${f(v / 1e3, 1)} ألف دينار ليبي`;
  return `${v} دينار ليبي`;
}
const parseAmount = s => Number(String(s ?? "").replace(/[^\d.]/g, "")) || 0;
function bindAmount(input, onChange) {
  const fmt = () => {
    const raw = parseAmount(input.value);
    input.value = raw ? nf.format(raw) : "";
    onChange?.(raw);
  };
  input.addEventListener("input", () => {
    // نحول الأرقام العربية-الهندية إلى لاتينية قبل التنسيق
    input.value = input.value.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
    fmt();
  });
  fmt();
}

function toast(msg, isErr) {

  $("#toasts").appendChild(t);

function modal({ title, body, actions = [], wide }) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-back"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">
    <div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-x aria-label="إغلاق">✕</button></div>
    <div class="modal-body">${body}</div>
    ${actions.length ? `<div class="modal-foot">${actions.map((a, i) => `<button class="btn ${a.cls || ""}" data-a="${i}">${a.label}</button>`).join("")}</div>` : ""}
  </div></div>`;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => e.key === "Escape" && close();
  document.addEventListener("keydown", onKey);
  $(".modal-back", root).addEventListener("mousedown", e => e.target.classList.contains("modal-back") && close());
  $("[data-x]", root).onclick = close;
  actions.forEach((a, i) => $(`[data-a="${i}"]`, root).onclick = async () => { if ((await a.onClick?.(root)) !== false) close(); });
  $("input,textarea,select", root)?.focus();
  return { root, close };
}

async function router() {

      const fab = $(".fab"); if (fab) fab.hidden = nav === "match" || nav === "new" || /-edit$/.test(hash);

}

// ============================================================ مطابقة قيمة المناقصة (الشاشة المحورية)
async function renderMatch() {
  crumbs("الترشيح", "مطابقة قيمة المناقصة");
  const s = state.meta.settings;
  const saved = (() => { try { return JSON.parse(sessionStorage.getItem("ss.match") || "{}"); } catch { return {}; } })();
  const m = { value: saved.value || 0, activity: saved.activity || "", date: saved.date || "", subs: saved.subs ?? true, tab: "eligible", selected: new Set(), compare: new Set(), open: new Set(), data: null };

  view().innerHTML = `
  <section class="match-hero">
    <h1>⚖ مطابقة قيمة المناقصة مع الموردين المؤهلين</h1>
    <p>أدخل القيمة التقديرية للمناقصة والنشاط المطلوب؛ يطبق المحرك قواعد الأهلية (BR-01 → BR-04) لحظياً ويعرض المرشحين وأسباب الاستبعاد.</p>
    <div class="match-form">
      <div>
        <label class="lbl" for="mValue">القيمة التقديرية للمناقصة (د.ل)</label>
        <input id="mValue" class="input value-input" inputmode="numeric" autocomplete="off" placeholder="0" value="${m.value || ""}">
        <div class="words" id="mWords"></div>
        <div class="quick">${[250000, 500000, 1000000, 2500000, 5000000, 10000000].map(v => `<button type="button" data-v="${v}">${amountWords(v).replace(" دينار ليبي", "")}</button>`).join("")}</div>
      </div>
      <div>
        <label class="lbl" for="mAct">النشاط المطلوب</label>
        <select id="mAct" class="select"><option value="">— كل الأنشطة —</option>${state.meta.activities.map(a => `<option ${a === m.activity ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
        <label class="switch"><input type="checkbox" id="mSubs" ${m.subs ? "checked" : ""}> تضمين الموردين ذوي النشاط الفرعي المطابق</label>
      </div>
      <div>
        <label class="lbl" for="mDate">تاريخ إقفال المناقصة</label>
        <input id="mDate" type="date" class="input" style="height:46px" min="${today()}" value="${m.date}">
        <div class="hint">يُتحقق من سريان السجل التجاري ومزاولة النشاط حتى هذا التاريخ (الافتراضي: اليوم).</div>
      </div>
    </div>
  </section>
  <div id="mResult"></div>`;

  const input = $("#mValue");
  const run = debounce(evaluate, 250);
  bindAmount(input, v => { m.value = v; $("#mWords").textContent = amountWords(v); run(); });
  $$(".quick button").forEach(b => b.onclick = () => { input.value = b.dataset.v; input.dispatchEvent(new Event("input")); });
  $("#mAct").onchange = e => { m.activity = e.target.value; evaluate(); };
  $("#mSubs").onchange = e => { m.subs = e.target.checked; evaluate(); };
  $("#mDate").onchange = e => { m.date = e.target.value; evaluate(); };
  if (!m.value) input.focus();

  async function evaluate() {
    try { sessionStorage.setItem("ss.match", JSON.stringify({ value: m.value, activity: m.activity, date: m.date, subs: m.subs })); } catch { }
    const box = $("#mResult");
    if (!box) return;
    if (!m.value) {
      box.innerHTML = `<div class="card card-pad empty" style="margin-top:18px"><div style="font-size:40px">💡</div><h2>ابدأ بإدخال قيمة المناقصة</h2>
        <p class="muted">يشترط النظام ألا تتجاوز قيمة المناقصة <b>${pct(s.maxTenderToCapitalRatio * 100)}</b> من رأس مال المورد، أي أن الحد الأدنى لرأس المال = القيمة ÷ ${s.maxTenderToCapitalRatio}.</p></div>`;
      return;
    }
    try {
      m.data = await api("POST", "/api/eligibility", { value: m.value, activity: m.activity || null, referenceDate: m.date || null, includeSubActivities: m.subs });
      m.selected = new Set(m.data.candidates.filter(c => c.eligible).map(c => c.supplierId));
      m.compare = new Set([...m.compare].filter(id => m.selected.has(id)));
      draw();
    } catch (e) { box.innerHTML = `<div class="callout danger" style="margin-top:18px">${esc(errText(e))}</div>`; }
  }

  function draw() {
    const d = m.data, box = $("#mResult");
    state.lastMatch = d;
    const elig = d.candidates.filter(c => c.eligible), excl = d.candidates.filter(c => !c.eligible);
    const list = m.tab === "eligible" ? elig : m.tab === "excluded" ? excl : d.candidates;
    const reasons = Object.entries(d.exclusionReasons).sort((a, b) => b[1] - a[1]);

    box.innerHTML = `
    <div class="summary">
      <div class="card"><div class="s-label">قيمة المناقصة</div><div class="s-value">${money(d.value)}</div></div>
      <div class="card"><div class="s-label">الحد الأدنى لرأس المال المطلوب</div><div class="s-value">${money(d.requiredMinCapital)}</div></div>
      <div class="card"><div class="s-label">الفئة الدنيا المكافئة</div><div class="s-value row">${tierBadge(d.requiredTier)} <span style="font-size:15px">${TIER_NAME[d.requiredTier]}</span></div></div>
      <div class="card" style="border-top:3px solid var(--ok)"><div class="s-label">موردون مؤهلون</div><div class="s-value num" style="color:var(--ok)">${d.eligibleCount} <span class="muted small">من ${d.total}</span></div></div>
      <div class="card" style="border-top:3px solid var(--danger)"><div class="s-label">مستبعدون</div><div class="s-value num" style="color:var(--danger)">${d.excludedCount}</div></div>
    </div>
    <div class="rule-box"><b>قاعدة BR-04:</b> قيمة المناقصة ≤ ${pct(d.ratio * 100)} من رأس المال
      ${reasons.length ? `<span class="muted">·</span> <b>أسباب الاستبعاد:</b> ${reasons.map(([r, c]) => `<span class="reason">${esc(r)} (${c})</span>`).join(" ")}` : ""}
      <span class="muted small" style="margin-inline-start:auto">زمن المعالجة: <span class="num">${d.elapsedMs}ms</span> · ${d.activity ? esc(d.activity) : "كل الأنشطة"} · حتى ${fdate(d.referenceDate)}</span>${exportButtons("match")}</div>

    <div class="card" style="margin-top:16px">
      <div class="tabs">
        <button class="tab ${m.tab === "eligible" ? "on" : ""}" data-tab="eligible">المؤهلون<span class="cnt num">${elig.length}</span></button>
        <button class="tab ${m.tab === "excluded" ? "on" : ""}" data-tab="excluded">المستبعدون وأسباب الاستبعاد<span class="cnt num">${excl.length}</span></button>
        <button class="tab ${m.tab === "all" ? "on" : ""}" data-tab="all">الكل<span class="cnt num">${d.candidates.length}</span></button>
        <button class="tab ${m.tab === "map" ? "on" : ""}" data-tab="map">خريطة الملاءة المالية</button>
      </div>
      ${m.tab === "map" ? capacityMap(d) : list.length ? list.map(candRow).join("") : `<div class="empty">${m.tab === "eligible" ? "لا يوجد موردون مؤهلون لهذه القيمة والنشاط — راجع تبويب المستبعدين لمعرفة الأسباب." : "لا يوجد مستبعدون."}</div>`}
      ${elig.length ? `<div class="sticky-actions">
        <div class="row"><b class="num">${m.selected.size}</b> مورد محدد لقائمة الدعوات
          <button class="btn btn-sm btn-ghost" id="selAll">تحديد الكل</button><button class="btn btn-sm btn-ghost" id="selNone">إلغاء التحديد</button></div>
        <div class="row">
          <button class="btn" id="cmpBtn" ${m.compare.size < 2 ? "disabled" : ""}>⇄ مقارنة (${m.compare.size}/4)</button>
          <button class="btn btn-primary" id="tenderBtn" ${m.selected.size ? "" : "disabled"}>✉ إنشاء مناقصة وإصدار قائمة الدعوات</button>
        </div></div>` : ""}
    </div>`;

    $$(".tab", box).forEach(t => t.onclick = () => { m.tab = t.dataset.tab; draw(); });
    $$("[data-sel]", box).forEach(c => c.onchange = () => { const id = +c.dataset.sel; c.checked ? m.selected.add(id) : m.selected.delete(id); draw(); });
    $$("[data-cmp]", box).forEach(c => c.onclick = () => {
      const id = +c.dataset.cmp;
      if (m.compare.has(id)) m.compare.delete(id); else if (m.compare.size < 4) m.compare.add(id); else return toast("يمكن مقارنة 4 موردين كحد أقصى", true);
      draw();
    });
    $$("[data-open]", box).forEach(c => c.onclick = () => { const id = +c.dataset.open; m.open.has(id) ? m.open.delete(id) : m.open.add(id); draw(); });
    $("#selAll", box) && ($("#selAll", box).onclick = () => { elig.forEach(c => m.selected.add(c.supplierId)); draw(); });
    $("#selNone", box) && ($("#selNone", box).onclick = () => { m.selected.clear(); draw(); });
    $("#cmpBtn", box) && ($("#cmpBtn", box).onclick = () => showCompare(d.candidates.filter(c => m.compare.has(c.supplierId)), d));
    $("#tenderBtn", box) && ($("#tenderBtn", box).onclick = () => createTenderDialog(m));
  }

  function candRow(c) {
    const util = Number(c.utilization), lim = m.data.ratio * 100;
    const scale = Math.max(100, Math.min(util, 300));
    const cls = util > lim ? "over" : util > lim * .8 ? "warn" : "";
    const failed = c.checks.filter(k => !k.passed);
    const ringColor = c.eligible ? (c.score >= 70 ? "var(--ok)" : "#e2a336") : "var(--danger)";
    return `<div class="cand ${c.eligible ? "" : "excluded"}">
      <div>${c.eligible ? `<input type="checkbox" data-sel="${c.supplierId}" ${m.selected.has(c.supplierId) ? "checked" : ""} title="ضمن قائمة الدعوات">` : `<span title="مستبعد" style="color:var(--danger);font-size:18px">⊘</span>`}</div>
      <div>${tierBadge(c.tier)}</div>
      <div><a class="c-name" href="#supplier-${c.supplierId}">${esc(c.name)}</a>
        <div class="muted small"><span class="num">${c.code}</span> · ${esc(c.city)} · ${esc(c.mainActivity)}</div>
        ${failed.length ? `<div class="reasons">${failed.map(k => `<span class="reason" title="${esc(k.message)}">${esc(k.title)}</span>`).join("")}</div>` : ""}
      </div>
      <div class="c-gauge">
        <div class="row between small"><span>رأس المال ${money(c.capital)}</span><span>الحد الأقصى للمناقصة ${money(c.maxTenderValue)}</span></div>
        <div class="gauge" title="نسبة قيمة المناقصة من رأس المال"><div class="g-fill ${cls}" style="width:${Math.min(util / scale * 100, 100)}%"></div><div class="g-limit" style="inset-inline-start:${lim / scale * 100}%"></div></div>
        <div class="gauge-cap"><span>الاستخدام ${pct(util)}</span><span>الحد ${pct(lim)}</span></div>
      </div>
      <div class="score"><div class="s-ring" style="border:3px solid ${ringColor};color:${ringColor}">${c.score}</div><span class="small muted">درجة<br>الترتيب</span></div>
      <div class="row" style="justify-content:flex-end;gap:4px">
        ${c.eligible ? `<button class="btn btn-sm ${m.compare.has(c.supplierId) ? "btn-primary" : ""}" data-cmp="${c.supplierId}" title="إضافة للمقارنة">⇄</button>` : ""}
        <button class="btn btn-sm" data-open="${c.supplierId}">${m.open.has(c.supplierId) ? "▲" : "▼"} القواعد</button>
      </div>
    </div>
    ${m.open.has(c.supplierId) ? `<div class="checks">${c.checks.map(k => `<div class="check"><span class="ci ${k.passed ? "ok" : "no"}">${k.passed ? "✓" : "✕"}</span><div><b>${esc(k.code)} · ${esc(k.title)}</b><div class="muted">${esc(k.message)}</div></div></div>`).join("")}</div>` : ""}`;
  }

  function capacityMap(d) {
    const rows = [...d.candidates].sort((a, b) => b.maxTenderValue - a.maxTenderValue);
    const max = Math.max(d.value * 1.15, ...rows.map(r => r.maxTenderValue)) || 1;
    return `<div class="capmap">
      <p class="muted small" style="margin-top:0">يمثل كل شريط الحد الأقصى لقيمة المناقصة التي يستطيع المورد التقدم لها (رأس المال × ${pct(d.ratio * 100)}). الخط الأحمر هو قيمة المناقصة الحالية؛ الأشرطة الخضراء لموردين مؤهلين.</p>
      ${rows.map(r => `<div class="cm-row"><a href="#supplier-${r.supplierId}" class="nowrap" style="overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</a>
        <div class="cm-track"><div class="cm-bar ${r.eligible ? "ok" : ""}" style="width:${r.maxTenderValue / max * 100}%"></div>
          <div class="cm-line" style="inset-inline-start:${d.value / max * 100}%"></div></div>
        <span class="small num">${nf.format(r.maxTenderValue)}</span></div>`).join("")}
      <div class="cm-row"><span></span><div style="position:relative;height:14px"><span class="small" style="position:absolute;inset-inline-start:${d.value / max * 100}%;transform:translateX(50%);color:var(--danger);font-weight:600;white-space:nowrap">▲ قيمة المناقصة ${moneyTxt(d.value)}</span></div><span></span></div>
    </div>`;
  }
  evaluate();
}

function showCompare(list, d) {
  const best = (fn, hi = true) => { const vals = list.map(fn); const b = hi ? Math.max(...vals) : Math.min(...vals); return v => v === b; };
  const rows = [
    ["الفئة", c => `${tierBadge(c.tier)} ${TIER_NAME[c.tier]}`],
    ["المدينة", c => esc(c.city)],
    ["النشاط الرئيسي", c => esc(c.mainActivity)],
    ["رأس المال", c => money(c.capital), c => c.capital],
    ["الحد الأقصى للمناقصة", c => money(c.maxTenderValue), c => c.maxTenderValue],
    ["نسبة الاستخدام", c => pct(c.utilization), c => -c.utilization],
    ["الهامش المتبقي", c => money(c.maxTenderValue - d.value), c => c.maxTenderValue - d.value],
    ["انتهاء السجل التجاري", c => `${fdate(c.commercialRegExpiry)}<div>${validityBadge(c.commercialRegExpiry)}</div>`, c => daysTo(c.commercialRegExpiry)],
    ["انتهاء مزاولة النشاط", c => `${fdate(c.practiceLicenseExpiry)}<div>${validityBadge(c.practiceLicenseExpiry)}</div>`, c => daysTo(c.practiceLicenseExpiry)],
    ["درجة الترتيب", c => `<b class="num">${c.score}</b> / 100`, c => c.score],
  ];
  modal({
    title: `مقارنة الموردين لمناقصة بقيمة ${moneyTxt(d.value)}`, wide: true,
    body: `<div class="table-wrap"><table class="compare-table"><thead><tr><th></th>${list.map(c => `<td><a href="#supplier-${c.supplierId}"><b>${esc(c.name)}</b></a><div class="muted small num">${c.code}</div></td>`).join("")}</tr></thead>
      <tbody>${rows.map(([label, fn, key]) => { const isBest = key ? best(key) : () => false; return `<tr><th>${label}</th>${list.map(c => `<td class="${key && list.length > 1 && isBest(key(c)) ? "best" : ""}">${fn(c)}</td>`).join("")}</tr>`; }).join("")}</tbody></table></div>
      <p class="hint">الخلايا المظللة بالأخضر تمثل الأفضل في كل معيار.</p>`,
    actions: [{ label: "إغلاق" }]
  });
}

function createTenderDialog(m) {
  if (!user.can("Procurement")) return toast("إنشاء المناقصات من صلاحية مسؤول المشتريات — بدّل الدور من قائمة المستخدم أعلى الصفحة", true);
  if (!m.activity) return toast("حدد النشاط المطلوب قبل إنشاء المناقصة", true);
  modal({
    title: "إنشاء مناقصة وإصدار قائمة الدعوات",
    body: `<div class="stack">
      <div class="callout info">سيتم دعوة <b class="num">${m.selected.size}</b> مورد مؤهل لمناقصة بقيمة <b>${moneyTxt(m.value)}</b> في نشاط «${esc(m.activity)}». يعيد النظام التحقق من الأهلية عند الحفظ.</div>
      <div><label class="lbl">عنوان المناقصة <span class="req">*</span></label><input class="input" id="tTitle" placeholder="مثال: توريد وتركيب منظومة كاميرات مراقبة للمقر الرئيسي"></div>
      <div><label class="lbl">تاريخ الإقفال <span class="req">*</span></label><input class="input" id="tDate" type="date" min="${today()}" value="${m.date || new Date(Date.now() + 21 * 864e5).toISOString().slice(0, 10)}"></div>
      <div><label class="lbl">الوصف / نطاق العمل</label><textarea class="input" id="tDesc" rows="3"></textarea></div>
      <div class="field-err" id="tErr"></div></div>`,
    actions: [{ label: "إلغاء" }, {
      label: "✉ إنشاء وإصدار القائمة", cls: "btn-primary", onClick: async root => {
        try {
          const r = await api("POST", "/api/tenders", { title: $("#tTitle", root).value, activity: m.activity, value: m.value, closingDate: $("#tDate", root).value, description: $("#tDesc", root).value, supplierIds: [...m.selected] });
          toast(`تم إنشاء المناقصة ${r.refNo} وإصدار قائمة الدعوات`);
          location.hash = `#tender-${r.id}`;
        } catch (e) { $("#tErr", root).textContent = errText(e); return false; }
      }
    }]
  });
}

// ============================================================ سجل الموردين
async function renderSuppliers() {
  crumbs("الموردون", "سجل الموردين");
  const f = (() => { try { return JSON.parse(sessionStorage.getItem("ss.filters") || "{}"); } catch { return {}; } })();
  view().innerHTML = `
  <div class="page-head"><div><h1>سجل الموردين</h1><p>البحث والتصفية حسب النشاط والحالة والفئة المالية.</p></div>
    <div class="row">${exportButtons("suppliers")}<a class="btn btn-primary" href="#new">＋ تعريف مورد جديد</a></div></div>
  <div class="card">
    <div class="card-head" style="flex-wrap:wrap">
      <input class="input" id="fQ" placeholder="🔍 بحث بالاسم أو الرمز أو رقم السجل التجاري" style="flex:2;min-width:220px" value="${esc(f.q || "")}">
      <select class="select" id="fAct" style="flex:1;min-width:160px"><option value="">كل الأنشطة</option>${state.meta.activities.map(a => `<option ${a === f.activity ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
      <select class="select" id="fStatus" style="flex:1;min-width:130px"><option value="">كل الحالات</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === f.status ? "selected" : ""}>${v[0]}</option>`).join("")}</select>
      <select class="select" id="fTier" style="flex:1;min-width:120px"><option value="">كل الفئات</option>${Object.entries(TIER_NAME).map(([k, v]) => `<option value="${k}" ${k === f.tier ? "selected" : ""}>${v}</option>`).join("")}</select>
      <select class="select" id="fCity" style="flex:1;min-width:110px"><option value="">كل المدن</option>${state.meta.cities.map(c => `<option ${c === f.city ? "selected" : ""}>${c}</option>`).join("")}</select>
    </div>
    <div id="sTable"></div>
  </div>`;
  const load = async () => {
    const q = { q: $("#fQ").value, activity: $("#fAct").value, status: $("#fStatus").value, tier: $("#fTier").value, city: $("#fCity").value };
    try { sessionStorage.setItem("ss.filters", JSON.stringify(q)); } catch { }
    const rows = await api("GET", "/api/suppliers?" + new URLSearchParams(Object.entries(q).filter(([, v]) => v)));
    state.lastSupplierIds = rows.map(r => r.id); state.lastSupplierFilter = q;
    $("#sTable").innerHTML = `<div class="table-wrap"><table class="tbl"><thead><tr>
      <th>الفئة</th><th>المورد</th><th>النشاط الرئيسي</th><th>المدينة</th><th>رأس المال</th><th>السجل التجاري</th><th>مزاولة النشاط</th><th>الحالة</th></tr></thead><tbody>
      ${rows.length ? rows.map(r => `<tr class="clickable" onclick="location.hash='#supplier-${r.id}'">
        <td>${tierBadge(r.tier)}</td>
        <td><div class="name">${esc(r.nameAr)} ${r.alertLevel !== "ok" ? `<span title="تنبيه صلاحية" style="color:var(--${r.alertLevel === "danger" ? "danger" : "warn"})">●</span>` : ""}</div><div class="muted small"><span class="num">${r.code}</span> · ${esc(r.legalForm)}</div></td>
        <td>${esc(r.mainActivity)}${r.subActivities.length ? `<div class="muted small">+${r.subActivities.length} نشاط فرعي</div>` : ""}</td>
        <td>${esc(r.city)}</td><td class="nowrap">${money(r.capital)}</td>
        <td><span class="num small">${esc(r.commercialRegNo)}</span><div>${validityBadge(r.commercialRegExpiryDate)}</div></td>
        <td>${validityBadge(r.practiceLicenseExpiryDate)}</td>
        <td>${statusBadge(r.status)}${r.missing ? `<div class="muted small">${r.missing} بيانات ناقصة</div>` : ""}</td></tr>`).join("")
        : `<tr><td colspan="8" class="empty">لا توجد نتائج مطابقة</td></tr>`}
      </tbody></table></div><div class="card-body muted small">عدد النتائج: <b class="num">${rows.length}</b></div>`;
  };
  $("#fQ").oninput = debounce(load);
  ["#fAct", "#fStatus", "#fTier", "#fCity"].forEach(s => $(s).onchange = load);
  await load();
}

// ============================================================ صفحة إضافة / تعديل المورد (صفحة واحدة بكل البيانات والمستندات)
const SECTIONS = [
  { key: "basic", title: "البيانات الأساسية والتواصل", icon: "🏷", docs: [] },
  { key: "cr", title: "النشاط والسجل التجاري", icon: "📄", docs: ["CommercialRegistry", "ChamberCertificate"] },
  { key: "license", title: "إذن مزاولة النشاط", icon: "🪪", docs: ["PracticeLicense"] },
  { key: "realestate", title: "السجل العقاري للمقر", icon: "🏢", docs: ["RealEstateRegistry"] },
  { key: "inc", title: "عقد التأسيس والشركاء", icon: "📜", docs: ["IncorporationContract"] },
  { key: "fin", title: "البيانات المالية", icon: "💰", docs: ["BankLetter", "TaxCertificate"] },

const CORE_DOCS = ["CommercialRegistry", "PracticeLicense", "RealEstateRegistry", "IncorporationContract"];

const FIELDS = {
  basic: [
    { k: "nameAr", l: "اسم المورد (بالعربية)", req: true, full: true, ph: "كما ورد في السجل التجاري" },
    { k: "nameEn", l: "الاسم باللغة الإنجليزية", ltr: true },
    { k: "legalForm", l: "الشكل القانوني", req: true, type: "select", opts: () => state.meta.legalForms },
    { k: "city", l: "المدينة", req: true, type: "select", opts: () => state.meta.cities },
    { k: "address", l: "العنوان التفصيلي" },
    { k: "phone", l: "هاتف الشركة", ltr: true, ph: "021-0000000" },
    { k: "email", l: "البريد الإلكتروني", ltr: true, type: "email", ph: "info@company.ly" },
    { k: "contactPerson", l: "مسؤول التواصل" },
    { k: "contactPhone", l: "هاتف مسؤول التواصل", ltr: true, ph: "091-0000000" },
  ],
  cr: [
    { k: "mainActivity", l: "النشاط الرئيسي", req: true, type: "select", opts: () => state.meta.activities, full: true },
